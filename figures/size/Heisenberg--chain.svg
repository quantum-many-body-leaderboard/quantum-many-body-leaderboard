<svg xmlns="http://www.w3.org/2000/svg" width="920" height="549" viewBox="0 0 920 549" role="img" aria-labelledby="title desc">
<title id="title">Heisenberg chain: the best energies at each size</title>
<desc id="desc">periodic: 10 energies at 2 sizes, sizes 20, 200; open: 7 energies at 2 sizes, sizes 20, 200</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="549" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Heisenberg chain: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#52514e">2 Hamiltonians, one panel per set of couplings, at every size with a published result. Each size is placed against its exact energy</text>
<text x="28" y="81" font-size="13" fill="#52514e">where it has one (sizes in grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band</text>
<text x="28" y="100" font-size="13" fill="#52514e">above the plot. One line per method family through its best energy at each size. Here the axis is inverted: a better energy is</text>
<text x="28" y="119" font-size="13" fill="#52514e">higher.</text>
