<text x="28" y="509" font-size="11.5" fill="#898781">Sizes are numbers of sites. A family's line joins its best energy at each size, whichever paper set it, so one line can join several calculations.</text>
<text x="28" y="525" font-size="11.5" fill="#898781">Where the reference is the record, the heights show how far the other rows are from it, and nothing about the record itself.</text>
