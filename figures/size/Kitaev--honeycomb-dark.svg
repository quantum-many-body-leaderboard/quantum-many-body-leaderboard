<title id="title">Kitaev (K-J-Γ) honeycomb: the best energies at each size</title>
<desc id="desc">periodic, K = -1, J = 0, Gamma = 0: 12 energies at 2 sizes, sizes 24, 32; open, K = -1, J = 0, Gamma = 0: 11 energies at 3 sizes, sizes 50, 98, 242</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="549" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Kitaev (K-J-Γ) honeycomb: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">2 Hamiltonians, one panel per set of couplings, at every size with a published result. Each size is placed against its exact energy</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">where it has one (sizes in grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">above the plot. One line per method family through its best energy at each size. Here the axis is inverted: a better energy is</text>
<text x="28" y="119" font-size="13" fill="#c3c2b7">higher.</text>
<path d="M28 149H42" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
