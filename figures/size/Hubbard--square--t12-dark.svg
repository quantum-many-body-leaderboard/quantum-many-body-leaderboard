<title id="title">Hubbard square, t12: the best energies at each size</title>
<desc id="desc">periodic, U = 8, t2 = -0.2, n = 0.875: 34 energies at 2 sizes, sizes 64, 256</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="570" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Hubbard square, t12: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">One Hamiltonian, at every size with a published result. Each size is placed against its exact energy where it has one (sizes in</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band above the plot. One line per</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">method family through its best energy at each size. Here the axis is inverted: a better energy is higher.</text>
