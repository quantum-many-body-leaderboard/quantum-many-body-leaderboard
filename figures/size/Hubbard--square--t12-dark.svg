<text x="749" y="419.4" font-size="10.5" fill="#c3c2b7">backflow / Pfaffian</text>
<text x="28" y="530" font-size="11.5" fill="#898781">Sizes are numbers of sites. A family's line joins its best energy at each size, whichever paper set it, so one line can join several calculations.</text>
<text x="28" y="546" font-size="11.5" fill="#898781">Where the reference is the record, the heights show how far the other rows are from it, and nothing about the record itself.</text>
