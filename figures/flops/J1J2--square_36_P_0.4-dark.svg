<text x="94" y="480" font-size="9.5" fill="#898781">exact: −0.529745 (ED), no cost stated, not drawn</text>
<text x="28" y="502" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates count iterations × samples × (connected configurations + sampler</text>
<text x="28" y="518" font-size="11.5" fill="#898781">proposals + 3) × forward-pass FLOPs × evaluations per amplitude, stage by stage, from the counts the paper or run script states. They include</text>
<text x="28" y="534" font-size="11.5" fill="#898781">the optimizer's solve where the code is known, and leave out pre-training. DMRG estimates count the dense tensor contractions of every sweep</text>
<text x="28" y="550" font-size="11.5" fill="#898781">in the run script's schedule, plus its variance evaluations. They leave out the saving from conserved quantum numbers, so a symmetric code does</text>
<text x="28" y="566" font-size="11.5" fill="#898781">less arithmetic than this. 1 of these estimates needed an assumption (an architecture detail, or a Lanczos count taken from the calibration</text>
<text x="28" y="582" font-size="11.5" fill="#898781">run).</text>
