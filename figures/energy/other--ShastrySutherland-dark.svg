<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Shastry-Sutherland: Hamiltonians published at one size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Hamiltonians of this model published at one size only. Each panel shares lattice, boundary and size; the coupling or filling that</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">differs runs along x. Colour shows the bound type, and a slashed mark is a flagged row.</text>
