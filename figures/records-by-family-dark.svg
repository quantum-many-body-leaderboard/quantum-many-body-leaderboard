<title id="title">Records by ansatz family</title>
<desc id="desc">tensor network: 47 records, 17 contested; AFQMC / GFMC: 35 records, 7 contested; classic VMC: 17 records, 7 contested; transformer / ViT: 22 records, 5 contested; backflow / Pfaffian: 15 records, 3 contested; RNN: 4 records, 3 contested; CNN / ResNet: 22 records, 2 contested; RBM: 3 records, 1 contested</desc>
