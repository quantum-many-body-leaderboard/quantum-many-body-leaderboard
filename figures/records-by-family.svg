<title id="title">Records by ansatz family</title>
<desc id="desc">FCIQMC / CC: 32 records, 25 contested; DMC: 30 records, 22 contested; tensor network: 47 records, 17 contested; AFQMC / GFMC: 40 records, 9 contested; other NQS: 39 records, 8 contested; classic VMC: 29 records, 7 contested; transformer / ViT: 25 records, 5 contested; backflow / Pfaffian: 15 records, 3 contested; RNN: 4 records, 3 contested; CNN / ResNet: 22 records, 2 contested; RBM: 3 records, 1 contested</desc>
