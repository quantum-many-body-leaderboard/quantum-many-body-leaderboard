<rect width="920" height="638" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Records by ansatz family</text>
<text x="28" y="62" font-size="13" fill="#52514e">Over the 250 records on unsolved instances; the 246 solved instances, where the exact energy is the record, are left out.</text>
<text x="28" y="81" font-size="13" fill="#52514e">Counting every instance rewards whichever method was run on the most easy problems, so the contested bars count only</text>
<text x="28" y="100" font-size="13" fill="#52514e">instances with 5+ published rows, which is where the field is actually competing.</text>
