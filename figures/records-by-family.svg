<title id="title">Records by ansatz family</title>
<desc id="desc">DMC: 20 records, 20 contested; tensor network: 47 records, 17 contested; other NQS: 42 records, 11 contested; AFQMC / GFMC: 35 records, 7 contested; classic VMC: 33 records, 7 contested; transformer / ViT: 25 records, 5 contested; backflow / Pfaffian: 15 records, 3 contested; RNN: 4 records, 3 contested; FCIQMC / CC: 4 records, 3 contested; CNN / ResNet: 22 records, 2 contested; RBM: 3 records, 1 contested</desc>
