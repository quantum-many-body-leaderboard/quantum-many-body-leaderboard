# Start QMBL: Open Problems' readme workflow after every push to main. Its README's leaderboard is
# generated from this repository's data and code (open-problems/scripts/readme.mjs reads a checkout
# of it), and a push here starts no workflow in another repository on its own. This workflow calls
# the GitHub API with OPEN_PROBLEMS_DISPATCH_TOKEN, a fine-grained token that can only run Actions
# on open-problems (Actions: read and write; it cannot push or edit files). open-problems has no
# scheduled run, so the call failing, an expired token included, fails this run: a README left
# behind shows here as a red run.
name: open-problems-readme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start open-problems' readme workflow
        env:
          TOKEN: ${{ secrets.OPEN_PROBLEMS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::the secret OPEN_PROBLEMS_DISPATCH_TOKEN is not set"; exit 1; fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}' \
            https://api.github.com/repos/quantum-many-body-leaderboard/open-problems/actions/workflows/readme.yml/dispatches
