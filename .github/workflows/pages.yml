# Build qmbl.org from data/ and deploy it to GitHub Pages.
#
# The site is generated, never committed: scripts/site.mjs reads data/ and writes _site/,
# with no dependencies. The workflow needs node and two checkouts: this repository, and the
# public QMBL: Open Problems repository, from which /open-problems/ is built
# (scripts/open_problems.mjs). The custom domain is set in the repository's Pages settings;
# an Actions deploy ignores a CNAME file.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running deploy: it can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # After this repository's checkout, which would clean it away; a new verified entry
      # there is published by running this workflow by hand (workflow_dispatch).
      - uses: actions/checkout@v4
        with:
          repository: quantum-many-body-leaderboard/open-problems
          path: open-problems
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the data
        run: node scripts/validate.mjs
      - name: Build the site
        run: node scripts/site.mjs
        env:
          OPEN_PROBLEMS_DIR: open-problems
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
