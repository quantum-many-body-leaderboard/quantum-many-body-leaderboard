# Build qmbl.org from data/ and deploy it to GitHub Pages.
#
# The site is generated, never committed: scripts/site.mjs reads data/ and writes _site/,
# with no dependencies. The workflow needs node and two checkouts: this repository, and the
# public QMBL: Open Problems repository, from which /open-problems/ is built
# (scripts/open_problems.mjs). The custom domain is set in the repository's Pages settings;
# an Actions deploy ignores a CNAME file.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running deploy: it can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # After this repository's checkout, which would clean it away; a new verified entry
      # there is published by running this workflow by hand (workflow_dispatch).
      - uses: actions/checkout@v4
        with:
          repository: quantum-many-body-leaderboard/open-problems
          path: open-problems
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the data
        run: node scripts/validate.mjs
      # The previous deploy's page hashes and dates: a page that has not changed keeps its date in
      # sitemap.xml (scripts/site.mjs, lastmod.json). Without them every page is dated today.
      - name: Fetch the previous page dates
        run: curl -fsS "https://qmbl.org/lastmod.json?v=$GITHUB_SHA" -o "$RUNNER_TEMP/lastmod.json" || echo "no previous lastmod.json; every page is dated today"
      - name: Build the site
        run: node scripts/site.mjs
        env:
          OPEN_PROBLEMS_DIR: open-problems
          PREV_LASTMOD: ${{ runner.temp }}/lastmod.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # The pages this deploy changed (dated today in lastmod.json) go to IndexNow, which passes
      # them to Bing and the other engines that take part. The query string gets past the CDN's
      # cached copy; a failure here never fails the deploy.
      - name: Send the changed pages to IndexNow
        continue-on-error: true
        run: |
          node --input-type=module -e '
            const today = new Date().toISOString().slice(0, 10);
            let lm;
            for (let i = 0; i < 6; i++) {
              lm = await (await fetch(`https://qmbl.org/lastmod.json?v=${process.env.GITHUB_SHA}-${i}`)).json();
              if (lm.built === today) break;
              await new Promise(r => setTimeout(r, 30000));
            }
            if (lm.built !== today) throw new Error(`lastmod.json is from ${lm.built}, not this deploy`);
            const urlList = Object.entries(lm.pages).filter(([, p]) => p.date === today).map(([u]) => `https://qmbl.org${u}`);
            if (!urlList.length) { console.log("no page changed"); process.exit(0); }
            const res = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST", headers: { "content-type": "application/json; charset=utf-8" },
              body: JSON.stringify({ host: "qmbl.org", key: lm.indexnow_key, keyLocation: `https://qmbl.org/${lm.indexnow_key}.txt`, urlList }),
            });
            console.log(`IndexNow: ${urlList.length} pages, HTTP ${res.status}`);
            if (!res.ok) throw new Error(await res.text());
          '
